# Jaeles signature (plugin class C) — exposed Spring Boot Actuator endpoints.
#
# Chosen as the shipped example because it shows what Jaeles is *for*: a small
# set of related requests whose interpretation depends on which ones respond.
# /actuator/health being public is usually intended; /actuator/env exposing
# configuration, or /actuator/heapdump returning a memory image, is not.
id: easyhunt-exposed-actuator

info:
  name: Exposed Spring Boot Actuator
  author: easyhunt
  risk: High
  confidence: Medium
  description: |
    Detects Spring Boot Actuator endpoints served without authentication.
    /env and /configprops disclose configuration including credentials;
    /heapdump returns a full memory image, which routinely contains session
    tokens and database passwords.

variables:
  - endpoint:
      - "/actuator/env"
      - "/actuator/configprops"
      - "/actuator/heapdump"
      - "/actuator/mappings"
      - "/env"
      - "/heapdump"

requests:
  - method: GET
    url: "{{.BaseURL}}{{.endpoint}}"
    headers:
      Accept: "application/json, application/vnd.spring-boot.actuator.v3+json"
    redirect: false
    detections:
      - >
        StatusCode() == 200 &&
        (
          StringSearch(component, "response", "activeProfiles") ||
          StringSearch(component, "response", "propertySources") ||
          StringSearch(component, "response", "systemEnvironment") ||
          StringSearch(component, "response", "contexts")
        )

# Every Jaeles signature EasyHunt ships states how a hit gets confirmed. A 200
# from /actuator/health proves nothing; a 200 from /env containing real property
# sources is the finding.
verify:
  manual: true
  note: >
    Fetch the matched endpoint by hand and confirm it returns real configuration
    rather than a stub or an error page rendered with HTTP 200. For /heapdump,
    confirm the response is actually a heap dump (it will be large and binary) —
    but do NOT download or retain it. Note its presence and size, and stop.

remediation: >
  Set management.endpoints.web.exposure.include to the minimum required, put the
  actuator on a separate management port that is not internet-facing, and require
  authentication. Rotate every credential that appeared in /env or a heap dump.

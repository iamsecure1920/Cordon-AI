id: exposed-env-file
kind: rule-pack
phase: vuln_scan
mode: passive
severity: high
description: Detects a world-readable .env served from the web root, containing credential keys.
author: easyhunt
license: MIT
inputs: [http_response]
condition: and
matchers:
  - type: status
    status: [200]
  - type: word
    part: body
    condition: or
    words:
      - "DB_PASSWORD="
      - "AWS_SECRET_ACCESS_KEY="
      - "SECRET_KEY="
      - "STRIPE_SECRET"
  - type: word
    part: header
    negative: true
    words: ["text/html"]
extractors:
  - name: env_keys
    type: regex
    part: body
    group: 1
    regex:
      - '(?m)^([A-Z][A-Z0-9_]{2,})='
verify:
  manual: true
  note: >
    Fetch the URL again by hand and confirm the file is genuinely served rather
    than a soft-404 or a seeded canary. Confirm at least one extracted key is a
    real credential shape before reporting, and never test a credential you find
    against a service the program has not put in scope.
remediation: >
  Move the file out of the web root and rotate every credential it exposed —
  disclosure is compromise. Add a deny rule for dotfiles at the web server level
  rather than relying on the file not being deployed.
references:
  - https://owasp.org/www-project-web-security-testing-guide/
tags: [exposure, secrets, config]

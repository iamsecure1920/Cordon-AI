<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="230" viewBox="0 0 1180 230" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" role="img" aria-labelledby="herotitle">
  <title id="herotitle">EasyHunt AI — the control plane is the security boundary</title>
  <defs>
    <linearGradient id="hbg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0d1117"/>
      <stop offset="1" stop-color="#161b22"/>
    </linearGradient>

    <!-- Sweeping shimmer across the wordmark. gradientUnits=objectBoundingBox so
         the translate is in units of the text's own width. -->
    <linearGradient id="shimmer" x1="0" y1="0" x2="1" y2="0" gradientUnits="objectBoundingBox">
      <stop offset="0.00" stop-color="#58a6ff" stop-opacity="0"/>
      <stop offset="0.42" stop-color="#58a6ff" stop-opacity="0"/>
      <stop offset="0.50" stop-color="#e6edf3" stop-opacity="1"/>
      <stop offset="0.58" stop-color="#3fb950" stop-opacity="0"/>
      <stop offset="1.00" stop-color="#3fb950" stop-opacity="0"/>
      <animateTransform attributeName="gradientTransform" type="translate"
                        values="-1 0; 1 0" dur="3.6s" repeatCount="indefinite"/>
    </linearGradient>

    <filter id="hglow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1180" height="230" rx="14" fill="url(#hbg)"/>

  <!-- scanner sweep: a soft vertical bar crossing the card -->
  <rect x="-160" y="0" width="160" height="230" fill="#58a6ff" opacity="0.055">
    <animate attributeName="x" values="-160;1180" dur="4.4s" repeatCount="indefinite"/>
  </rect>

  <!-- wordmark: base layer, then the shimmer copy on top -->
  <text x="40" y="86" font-size="46" font-weight="bold" fill="#e6edf3" letter-spacing="1">EasyHunt AI</text>
  <text x="40" y="86" font-size="46" font-weight="bold" fill="url(#shimmer)" letter-spacing="1">EasyHunt AI</text>

  <text x="42" y="116" font-size="14" fill="#8b949e">the control plane — not the model — is the security boundary</text>

  <!-- live cursor, so the card reads as running rather than printed -->
  <rect x="497" y="103" width="9" height="17" fill="#3fb950">
    <animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.5;0.51;1" dur="1.1s" repeatCount="indefinite"/>
  </rect>

  <!-- the chain: each gate lights in turn, 7s loop, matching the flow diagram -->
  <g font-size="12" text-anchor="middle" fill="#e6edf3">
    <g>
      <rect x="40" y="152" width="132" height="40" rx="8" fill="#f85149" opacity="0.3">
        <animate attributeName="opacity" values="0.3;1;1;0.3;0.3" keyTimes="0;0.04;0.12;0.2;1" dur="7s" begin="0s" repeatCount="indefinite"/>
      </rect>
      <text x="106" y="177">scope</text>
    </g>
    <g>
      <rect x="188" y="152" width="132" height="40" rx="8" fill="#f85149" opacity="0.3">
        <animate attributeName="opacity" values="0.3;1;1;0.3;0.3" keyTimes="0;0.04;0.12;0.2;1" dur="7s" begin="0.42s" repeatCount="indefinite"/>
      </rect>
      <text x="254" y="177">sanitize</text>
    </g>
    <g>
      <rect x="336" y="152" width="132" height="40" rx="8" fill="#d29922" opacity="0.3">
        <animate attributeName="opacity" values="0.3;1;1;0.3;0.3" keyTimes="0;0.04;0.12;0.2;1" dur="7s" begin="0.84s" repeatCount="indefinite"/>
      </rect>
      <text x="402" y="177">budget</text>
    </g>
    <g>
      <rect x="484" y="152" width="132" height="40" rx="8" fill="#d29922" opacity="0.3">
        <animate attributeName="opacity" values="0.3;1;1;0.3;0.3" keyTimes="0;0.04;0.12;0.2;1" dur="7s" begin="1.26s" repeatCount="indefinite"/>
      </rect>
      <text x="550" y="177">rate-limit</text>
    </g>
    <g>
      <rect x="632" y="152" width="132" height="40" rx="8" fill="#f0883e" opacity="0.3">
        <animate attributeName="opacity" values="0.3;1;1;0.3;0.3" keyTimes="0;0.04;0.12;0.2;1" dur="7s" begin="1.68s" repeatCount="indefinite"/>
      </rect>
      <text x="698" y="177">approval</text>
    </g>
    <g>
      <rect x="780" y="152" width="132" height="40" rx="8" fill="#1f6feb" opacity="0.3">
        <animate attributeName="opacity" values="0.3;1;1;0.3;0.3" keyTimes="0;0.04;0.12;0.2;1" dur="7s" begin="2.1s" repeatCount="indefinite"/>
      </rect>
      <text x="846" y="177">sandbox</text>
    </g>
    <g>
      <rect x="928" y="152" width="132" height="40" rx="8" fill="#3fb950" opacity="0.3">
        <animate attributeName="opacity" values="0.3;1;1;0.3;0.3" keyTimes="0;0.04;0.12;0.2;1" dur="7s" begin="2.52s" repeatCount="indefinite"/>
      </rect>
      <text x="994" y="177">audit</text>
    </g>
  </g>

  <!-- packet running the chain, synced to the gates above -->
  <circle r="6" fill="#58a6ff" filter="url(#hglow)">
    <animateMotion dur="7s" repeatCount="indefinite" path="M 106 172 L 994 172"/>
  </circle>
  <circle r="4" fill="#58a6ff" opacity="0.5" filter="url(#hglow)">
    <animateMotion dur="7s" begin="-0.15s" repeatCount="indefinite" path="M 106 172 L 994 172"/>
  </circle>

  <text x="1140" y="177" text-anchor="end" font-size="11" fill="#8b949e">no bypass</text>
</svg>

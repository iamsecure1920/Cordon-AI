  <line x1="136" y1="140" x2="1012" y2="140" stroke="#30363d" stroke-width="2"/>
  <line x1="136" y1="140" x2="1012" y2="140" stroke="#58a6ff" stroke-width="2" stroke-opacity="0.55" stroke-dasharray="14 12">
    <animate attributeName="stroke-dashoffset" from="26" to="0" dur="0.7s" repeatCount="indefinite"/>
  </line>
  <circle r="8" fill="#58a6ff" filter="url(#glow)">
    <animateMotion dur="7s" repeatCount="indefinite" path="M 88 140 L 1060 140 L 1060 210 L 88 210 L 88 140"/>
  </circle>
  <circle r="5.5" fill="#58a6ff" opacity="0.55" filter="url(#glow)">
    <animateMotion dur="7s" begin="-0.18s" repeatCount="indefinite" path="M 88 140 L 1060 140 L 1060 210 L 88 210 L 88 140"/>
  </circle>
  <circle r="3.5" fill="#58a6ff" opacity="0.28" filter="url(#glow)">
    <animateMotion dur="7s" begin="-0.36s" repeatCount="indefinite" path="M 88 140 L 1060 140 L 1060 210 L 88 210 L 88 140"/>
  </circle>
  <line x1="88" y1="210" x2="1060" y2="210" stroke="#30363d" stroke-width="2" stroke-dasharray="4 4"/>
  <line x1="88" y1="210" x2="1060" y2="210" stroke="#3fb950" stroke-width="2" stroke-opacity="0.4" stroke-dasharray="10 14">
    <animate attributeName="stroke-dashoffset" from="0" to="24" dur="0.9s" repeatCount="indefinite"/>
  </line>

  <text x="574" y="128" text-anchor="middle" fill="#8b949e" font-size="10.5">asset store: kind + tag</text>
  <text x="574" y="232" text-anchor="middle" fill="#8b949e" font-size="11">status.jsonl — input=assets:url[live] · the audit trail of "what did this cover"</text>

  <g font-size="11" fill="#8b949e">
    <rect x="40" y="272" width="10" height="10" rx="2" fill="#8b5cf6"/>
    <text x="58" y="281">method</text>
    <rect x="130" y="272" width="10" height="10" rx="2" fill="#1f6feb"/>
    <text x="148" y="281">passive</text>
    <rect x="216" y="272" width="10" height="10" rx="2" fill="#d29922"/>
    <text x="234" y="281">aggressive</text>
    <rect x="316" y="272" width="10" height="10" rx="2" fill="#f0883e"/>
    <text x="334" y="281">exploit · gated</text>
    <rect x="432" y="272" width="10" height="10" rx="2" fill="#3fb950"/>
    <text x="450" y="281">deliverable</text>

<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="340" viewBox="0 0 1180 340" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" role="img" aria-labelledby="title">
  <title id="title">EasyHunt AI — the engagement pipeline</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0d1117"/>
      <stop offset="1" stop-color="#161b22"/>
    </linearGradient>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1180" height="340" rx="14" fill="url(#bg)"/>

  <text x="40" y="42" fill="#e6edf3" font-size="20" font-weight="bold">EasyHunt AI — the engagement pipeline</text>
  <text x="40" y="66" fill="#8b949e" font-size="13">each phase reads what the previous one found — the asset store is the conveyor</text>


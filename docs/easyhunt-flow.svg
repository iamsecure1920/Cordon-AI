<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="360" viewBox="0 0 1180 360" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" role="img" aria-labelledby="title">
  <title id="title">EasyHunt AI — one tool call, end to end</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0d1117"/>
      <stop offset="1" stop-color="#161b22"/>
    </linearGradient>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="1180" height="360" rx="14" fill="url(#bg)"/>

  <text x="40" y="42" fill="#e6edf3" font-size="20" font-weight="bold">EasyHunt AI — one tool call, end to end</text>
  <text x="40" y="66" fill="#8b949e" font-size="13">the model asks · the control plane decides · the sandboxed tool executes · everything is audited</text>

  <!-- ── forward rail: flowing dashes read as motion even before the packet arrives ── -->
  <line x1="128" y1="146" x2="1048" y2="146" stroke="#30363d" stroke-width="2"/>
  <line x1="128" y1="146" x2="1048" y2="146" stroke="#58a6ff" stroke-width="2" stroke-opacity="0.55" stroke-dasharray="14 12">
    <animate attributeName="stroke-dashoffset" from="26" to="0" dur="0.7s" repeatCount="indefinite"/>
  </line>

  <!-- ── return rail ────────────────────────────────────────────── -->
  <line x1="84" y1="250" x2="1092" y2="250" stroke="#30363d" stroke-width="2" stroke-dasharray="4 4"/>
  <line x1="84" y1="250" x2="1092" y2="250" stroke="#3fb950" stroke-width="2" stroke-opacity="0.4" stroke-dasharray="10 14">
    <animate attributeName="stroke-dashoffset" from="0" to="24" dur="0.9s" repeatCount="indefinite"/>
  </line>

  <!-- ── stage boxes ─────────────────────────────────────────────
       Each stage dims to 0.32 and snaps to full as the packet reaches it.
       dur is the 7s loop; keyTimes give a sharp on/off rather than a slow
       sine, which at 0.85→1 over 14s read as a static image.            -->
  <g font-size="12.5" text-anchor="middle" fill="#e6edf3">
    <rect x="40"  y="118" width="88" height="56" rx="9" fill="#1f6feb" opacity="0.32" stroke="#58a6ff" stroke-width="2" stroke-opacity="0">
      <animate attributeName="opacity" values="0.32;1;1;0.32;0.32" keyTimes="0;0.04;0.11;0.18;1" dur="7s" begin="0s" repeatCount="indefinite"/>
      <animate attributeName="stroke-opacity" values="0;1;0;0" keyTimes="0;0.05;0.16;1" dur="7s" begin="0s" repeatCount="indefinite"/>
    </rect>
    <text x="84"  y="143">MODEL</text>
    <text x="84"  y="160" font-size="9.5" fill="#8b949e">strategy only</text>

    <rect x="152" y="118" width="88" height="56" rx="9" fill="#8b5cf6" opacity="0.32" stroke="#c9a6ff" stroke-width="2" stroke-opacity="0">
      <animate attributeName="opacity" values="0.32;1;1;0.32;0.32" keyTimes="0;0.04;0.11;0.18;1" dur="7s" begin="0.32s" repeatCount="indefinite"/>
      <animate attributeName="stroke-opacity" values="0;1;0;0" keyTimes="0;0.05;0.16;1" dur="7s" begin="0.32s" repeatCount="indefinite"/>
    </rect>
    <text x="196" y="143">MCP</text>
    <text x="196" y="160" font-size="9.5" fill="#d0bfff">server door</text>

    <rect x="264" y="118" width="88" height="56" rx="9" fill="#f85149" opacity="0.32" stroke="#ff9d97" stroke-width="2" stroke-opacity="0">
      <animate attributeName="opacity" values="0.32;1;1;0.32;0.32" keyTimes="0;0.04;0.11;0.18;1" dur="7s" begin="0.64s" repeatCount="indefinite"/>
      <animate attributeName="stroke-opacity" values="0;1;0;0" keyTimes="0;0.05;0.16;1" dur="7s" begin="0.64s" repeatCount="indefinite"/>
    </rect>
    <text x="308" y="143">scope</text>
    <text x="308" y="160" font-size="9.5" fill="#ffd7d5">fail closed</text>

    <rect x="376" y="118" width="88" height="56" rx="9" fill="#f85149" opacity="0.32" stroke="#ff9d97" stroke-width="2" stroke-opacity="0">
      <animate attributeName="opacity" values="0.32;1;1;0.32;0.32" keyTimes="0;0.04;0.11;0.18;1" dur="7s" begin="0.96s" repeatCount="indefinite"/>
      <animate attributeName="stroke-opacity" values="0;1;0;0" keyTimes="0;0.05;0.16;1" dur="7s" begin="0.96s" repeatCount="indefinite"/>
    </rect>
    <text x="420" y="143">sanitize</text>
    <text x="420" y="160" font-size="9.5" fill="#ffd7d5">reject · no clean</text>

    <rect x="488" y="118" width="88" height="56" rx="9" fill="#d29922" opacity="0.32" stroke="#e3b341" stroke-width="2" stroke-opacity="0">
      <animate attributeName="opacity" values="0.32;1;1;0.32;0.32" keyTimes="0;0.04;0.11;0.18;1" dur="7s" begin="1.28s" repeatCount="indefinite"/>
      <animate attributeName="stroke-opacity" values="0;1;0;0" keyTimes="0;0.05;0.16;1" dur="7s" begin="1.28s" repeatCount="indefinite"/>
    </rect>
    <text x="532" y="143">budget</text>
    <text x="532" y="160" font-size="9.5" fill="#f0e6d2">USD · req · time</text>

    <rect x="600" y="118" width="88" height="56" rx="9" fill="#d29922" opacity="0.32" stroke="#e3b341" stroke-width="2" stroke-opacity="0">
      <animate attributeName="opacity" values="0.32;1;1;0.32;0.32" keyTimes="0;0.04;0.11;0.18;1" dur="7s" begin="1.6s" repeatCount="indefinite"/>
      <animate attributeName="stroke-opacity" values="0;1;0;0" keyTimes="0;0.05;0.16;1" dur="7s" begin="1.6s" repeatCount="indefinite"/>
    </rect>
    <text x="644" y="143">rate-limit</text>
    <text x="644" y="160" font-size="9.5" fill="#f0e6d2">per-request</text>

    <rect x="712" y="118" width="88" height="56" rx="9" fill="#f0883e" opacity="0.32" stroke="#ffb77c" stroke-width="2" stroke-opacity="0">
      <animate attributeName="opacity" values="0.32;1;1;0.32;0.32" keyTimes="0;0.04;0.11;0.18;1" dur="7s" begin="1.92s" repeatCount="indefinite"/>
      <animate attributeName="stroke-opacity" values="0;1;0;0" keyTimes="0;0.05;0.16;1" dur="7s" begin="1.92s" repeatCount="indefinite"/>
    </rect>
    <text x="756" y="143">approval</text>
    <text x="756" y="160" font-size="9.5" fill="#fbe3d0">human / policy</text>

    <rect x="824" y="118" width="88" height="56" rx="9" fill="#1f6feb" opacity="0.32" stroke="#58a6ff" stroke-width="2" stroke-opacity="0">
      <animate attributeName="opacity" values="0.32;1;1;0.32;0.32" keyTimes="0;0.04;0.11;0.18;1" dur="7s" begin="2.24s" repeatCount="indefinite"/>
      <animate attributeName="stroke-opacity" values="0;1;0;0" keyTimes="0;0.05;0.16;1" dur="7s" begin="2.24s" repeatCount="indefinite"/>
    </rect>
    <text x="868" y="143">sandbox</text>
    <text x="868" y="160" font-size="9.5" fill="#c2d9ff">read-only · caps</text>

    <rect x="936" y="118" width="88" height="56" rx="9" fill="#3fb950" opacity="0.32" stroke="#7ee787" stroke-width="2" stroke-opacity="0">
      <animate attributeName="opacity" values="0.32;1;1;0.32;0.32" keyTimes="0;0.04;0.11;0.18;1" dur="7s" begin="2.56s" repeatCount="indefinite"/>
      <animate attributeName="stroke-opacity" values="0;1;0;0" keyTimes="0;0.05;0.16;1" dur="7s" begin="2.56s" repeatCount="indefinite"/>
    </rect>
    <text x="980" y="143">audit</text>
    <text x="980" y="160" font-size="9.5" fill="#c9f3cd">hash-chained</text>

    <rect x="1048" y="118" width="88" height="56" rx="9" fill="#2ea043" opacity="0.32" stroke="#7ee787" stroke-width="2" stroke-opacity="0">
      <animate attributeName="opacity" values="0.32;1;1;0.32;0.32" keyTimes="0;0.04;0.11;0.18;1" dur="7s" begin="2.88s" repeatCount="indefinite"/>
      <animate attributeName="stroke-opacity" values="0;1;0;0" keyTimes="0;0.05;0.16;1" dur="7s" begin="2.88s" repeatCount="indefinite"/>
    </rect>
    <text x="1092" y="143">TOOL</text>
    <text x="1092" y="160" font-size="9.5" fill="#c9f3cd">sqlmap · nuclei · …</text>
  </g>

  <!-- ── the packet: 7s round trip, with a three-dot comet tail ──── -->
  <circle r="8" fill="#58a6ff" filter="url(#glow)">
    <animateMotion dur="7s" repeatCount="indefinite" path="M 84 146 L 1092 146 L 1092 250 L 84 250 L 84 146"/>
  </circle>
  <circle r="5.5" fill="#58a6ff" opacity="0.55" filter="url(#glow)">
    <animateMotion dur="7s" begin="-0.18s" repeatCount="indefinite" path="M 84 146 L 1092 146 L 1092 250 L 84 250 L 84 146"/>
  </circle>
  <circle r="3.5" fill="#58a6ff" opacity="0.28" filter="url(#glow)">
    <animateMotion dur="7s" begin="-0.36s" repeatCount="indefinite" path="M 84 146 L 1092 146 L 1092 250 L 84 250 L 84 146"/>
  </circle>

  <text x="590" y="136" text-anchor="middle" fill="#8b949e" font-size="11">request</text>
  <text x="590" y="272" text-anchor="middle" fill="#8b949e" font-size="11">structured result → candidate, not "clean"</text>

  <!-- ── legend ─────────────────────────────────────────────────── -->
  <g font-size="11" fill="#8b949e">
    <rect x="40" y="310" width="10" height="10" rx="2" fill="#f85149"/>
    <text x="58" y="319">enforced</text>
    <rect x="140" y="310" width="10" height="10" rx="2" fill="#d29922"/>
    <text x="158" y="319">metered</text>
    <rect x="230" y="310" width="10" height="10" rx="2" fill="#1f6feb"/>
    <text x="248" y="319">isolated</text>
    <rect x="320" y="310" width="10" height="10" rx="2" fill="#3fb950"/>
    <text x="338" y="319">recorded</text>
    <text x="1040" y="319" text-anchor="end">loop · every call · no bypass</text>
  </g>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="470" viewBox="0 0 1180 470" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" role="img" aria-labelledby="ltitle">
  <title id="ltitle">Cordon AI — the five layers, and where the security boundary sits</title>
  <defs>
    <linearGradient id="lbg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0d1117"/>
      <stop offset="1" stop-color="#161b22"/>
    </linearGradient>
    <filter id="lglow" x="-70%" y="-70%" width="240%" height="240%">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <!-- CRT scanlines: 2px band every 4px, barely there -->
    <pattern id="scan" width="4" height="4" patternUnits="userSpaceOnUse">
      <rect width="4" height="2" fill="#3fb950" opacity="0.028"/>
    </pattern>
  </defs>

  <rect width="1180" height="470" rx="14" fill="url(#lbg)"/>
  <rect width="1180" height="470" rx="14" fill="url(#scan)"/>

  <text x="40" y="40" fill="#3fb950" font-size="13" opacity="0.85">root@cordon:~$ <tspan fill="#e6edf3">stack --explain</tspan><tspan fill="#3fb950">
      <animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.5;0.51;1" dur="1.1s" repeatCount="indefinite"/>_</tspan></text>
  <text x="40" y="66" fill="#8b949e" font-size="12">five layers · strategy on top, knowledge at the bottom · every call crosses L3 and none may skip it</text>

  <!-- ══ L5 ══ -->
  <g>
    <rect x="40" y="88" width="1100" height="58" rx="8" fill="#8b5cf6" opacity="0.14" stroke="#8b5cf6" stroke-width="1.5" stroke-opacity="0.5">
      <animate attributeName="opacity" values="0.14;0.3;0.14" keyTimes="0;0.06;0.2" dur="6s" begin="0s" repeatCount="indefinite"/>
    </rect>
    <text x="60" y="112" fill="#c9a6ff" font-size="13" font-weight="bold">L5</text>
    <text x="60" y="132" fill="#8b949e" font-size="10">STRATEGY</text>
    <g font-size="11.5" fill="#e6edf3">
      <rect x="150" y="102" width="150" height="30" rx="5" fill="#8b5cf6" opacity="0.3"/><text x="225" y="121" text-anchor="middle">Claude CLI</text>
      <rect x="312" y="102" width="200" height="30" rx="5" fill="#8b5cf6" opacity="0.3"/><text x="412" y="121" text-anchor="middle">no network of its own</text>
      <rect x="524" y="102" width="150" height="30" rx="5" fill="#8b5cf6" opacity="0.3"/><text x="599" y="121" text-anchor="middle">8 phase skills</text>
    </g>
    <text x="1120" y="121" text-anchor="end" fill="#6e7681" font-size="10">plans · never executes</text>
  </g>

  <!-- ══ L4 ══ -->
  <g>
    <rect x="40" y="156" width="1100" height="58" rx="8" fill="#1f6feb" opacity="0.14" stroke="#1f6feb" stroke-width="1.5" stroke-opacity="0.5">
      <animate attributeName="opacity" values="0.14;0.3;0.14" keyTimes="0;0.06;0.2" dur="6s" begin="0.5s" repeatCount="indefinite"/>
    </rect>
    <text x="60" y="180" fill="#58a6ff" font-size="13" font-weight="bold">L4</text>
    <text x="60" y="200" fill="#8b949e" font-size="10">METHOD</text>
    <g font-size="11" fill="#e6edf3">
      <rect x="150" y="170" width="160" height="30" rx="5" fill="#1f6feb" opacity="0.3"/><text x="230" y="189" text-anchor="middle">WSTG · 115 tests</text>
      <rect x="322" y="170" width="170" height="30" rx="5" fill="#1f6feb" opacity="0.3"/><text x="407" y="189" text-anchor="middle">PAT · 96 techniques</text>
      <rect x="504" y="170" width="180" height="30" rx="5" fill="#1f6feb" opacity="0.3"/><text x="594" y="189" text-anchor="middle">coverage · 27 classes</text>
      <rect x="696" y="170" width="180" height="30" rx="5" fill="#1f6feb" opacity="0.3"/><text x="786" y="189" text-anchor="middle">payloads · 62 lists</text>
    </g>
    <text x="1120" y="189" text-anchor="end" fill="#6e7681" font-size="10">what to test, and how</text>
  </g>

  <!-- ══ L3 — the boundary ══ -->
  <g>
    <rect x="40" y="224" width="1100" height="76" rx="8" fill="#f85149" opacity="0.16" stroke="#f85149" stroke-width="2.5">
      <animate attributeName="stroke-opacity" values="0.55;1;0.55" dur="2.4s" repeatCount="indefinite"/>
    </rect>
    <text x="60" y="250" fill="#ff9d97" font-size="13" font-weight="bold">L3</text>
    <text x="60" y="270" fill="#8b949e" font-size="10">CONTROL</text>
    <text x="60" y="284" fill="#8b949e" font-size="10">PLANE</text>
    <g font-size="10.5" fill="#e6edf3" text-anchor="middle">
      <rect x="150" y="248" width="128" height="30" rx="5" fill="#f85149" opacity="0.34"/><text x="214" y="267">scope</text>
      <rect x="290" y="248" width="128" height="30" rx="5" fill="#f85149" opacity="0.34"/><text x="354" y="267">sanitize</text>
      <rect x="430" y="248" width="128" height="30" rx="5" fill="#d29922" opacity="0.34"/><text x="494" y="267">budget</text>
      <rect x="570" y="248" width="128" height="30" rx="5" fill="#d29922" opacity="0.34"/><text x="634" y="267">rate-limit</text>
      <rect x="710" y="248" width="128" height="30" rx="5" fill="#f0883e" opacity="0.34"/><text x="774" y="267">approval</text>
      <rect x="850" y="248" width="128" height="30" rx="5" fill="#1f6feb" opacity="0.34"/><text x="914" y="267">sandbox</text>
      <rect x="990" y="248" width="128" height="30" rx="5" fill="#3fb950" opacity="0.34"/><text x="1054" y="267">audit</text>
    </g>
    <text x="1120" y="243" text-anchor="end" fill="#ff9d97" font-size="10" font-weight="bold">THE SECURITY BOUNDARY</text>
  </g>

  <!-- ══ L2 ══ -->
  <g>
    <rect x="40" y="310" width="1100" height="58" rx="8" fill="#3fb950" opacity="0.14" stroke="#3fb950" stroke-width="1.5" stroke-opacity="0.5">
      <animate attributeName="opacity" values="0.14;0.3;0.14" keyTimes="0;0.06;0.2" dur="6s" begin="2.4s" repeatCount="indefinite"/>
    </rect>
    <text x="60" y="334" fill="#7ee787" font-size="13" font-weight="bold">L2</text>
    <text x="60" y="354" fill="#8b949e" font-size="10">EXECUTION</text>
    <g font-size="11" fill="#e6edf3">
      <rect x="150" y="324" width="150" height="30" rx="5" fill="#3fb950" opacity="0.3"/><text x="225" y="343" text-anchor="middle">80 MCP tools</text>
      <rect x="312" y="324" width="180" height="30" rx="5" fill="#3fb950" opacity="0.3"/><text x="402" y="343" text-anchor="middle">82 catalogued bins</text>
      <rect x="504" y="324" width="130" height="30" rx="5" fill="#3fb950" opacity="0.3"/><text x="569" y="343" text-anchor="middle">6 engines</text>
      <rect x="646" y="324" width="200" height="30" rx="5" fill="#3fb950" opacity="0.3"/><text x="746" y="343" text-anchor="middle">Docker per invocation</text>
    </g>
    <text x="1120" y="343" text-anchor="end" fill="#6e7681" font-size="10">read-only · caps dropped</text>
  </g>

  <!-- ══ L1 ══ -->
  <g>
    <rect x="40" y="378" width="1100" height="58" rx="8" fill="#d29922" opacity="0.14" stroke="#d29922" stroke-width="1.5" stroke-opacity="0.5">
      <animate attributeName="opacity" values="0.14;0.3;0.14" keyTimes="0;0.06;0.2" dur="6s" begin="2.9s" repeatCount="indefinite"/>
    </rect>
    <text x="60" y="402" fill="#e3b341" font-size="13" font-weight="bold">L1</text>
    <text x="60" y="422" fill="#8b949e" font-size="10">KNOWLEDGE</text>
    <g font-size="11" fill="#e6edf3">
      <rect x="150" y="392" width="190" height="30" rx="5" fill="#d29922" opacity="0.3"/><text x="245" y="411" text-anchor="middle">findings · PoC required</text>
      <rect x="352" y="392" width="150" height="30" rx="5" fill="#d29922" opacity="0.3"/><text x="427" y="411" text-anchor="middle">graph memory</text>
      <rect x="514" y="392" width="160" height="30" rx="5" fill="#d29922" opacity="0.3"/><text x="594" y="411" text-anchor="middle">detection rules</text>
      <rect x="686" y="392" width="150" height="30" rx="5" fill="#d29922" opacity="0.3"/><text x="761" y="411" text-anchor="middle">evidence store</text>
    </g>
    <text x="1120" y="411" text-anchor="end" fill="#6e7681" font-size="10">nothing is "clean" by default</text>
  </g>

  <!-- the call descending the stack, then the result returning -->
  <circle r="7" fill="#58a6ff" filter="url(#lglow)">
    <animateMotion dur="6s" repeatCount="indefinite"
      path="M 1105 117 L 1105 185 L 1105 262 L 1105 339 L 1105 407 L 95 407 L 95 117"/>
  </circle>
  <circle r="4.5" fill="#58a6ff" opacity="0.5" filter="url(#lglow)">
    <animateMotion dur="6s" begin="-0.2s" repeatCount="indefinite"
      path="M 1105 117 L 1105 185 L 1105 262 L 1105 339 L 1105 407 L 95 407 L 95 117"/>
  </circle>
</svg>

# Cordon AI — engagement scope artifact
#
# This file IS the legal authorization boundary for a run. The MCP control plane
# refuses every network-touching call whose target does not match it.
#
# Program policy text drifts. Re-pull it and update `fetched_at` before each run:
# a scope older than `max_age_days` triggers a warning, and `refuse_when_stale`
# turns that warning into a hard refusal.
version: 1

engagement:
  name: example-bbp
  # owned | bug-bounty | written-approval
  authorization: bug-bounty
  program_url: https://hackerone.com/example/policy
  # Required when authorization == written-approval. Ticket/contract reference.
  approval_ref: null
  # ISO-8601 UTC. When the policy above was last read and transcribed here.
  fetched_at: "2026-07-30T00:00:00Z"
  max_age_days: 7
  refuse_when_stale: false
  # Appended to the tagged user-agent so the target can identify your traffic.
  researcher_handle: your-handle
  # Where takeovers / infra bugs must be reported, if the program splits them out.
  vdp_note: null

in_scope:
  domains:
    - example.com
  wildcards:
    - "*.example.com"
  cidrs:
    - 203.0.113.0/24
  # Nmap-style octet ranges.
  ip_ranges:
    - 198.51.100.10-50
  # Anchored full-match against the normalized hostname.
  regex:
    - '^api-\d+\.example\.com$'
  urls:
    - https://app.example.com/v2/

out_of_scope:
  # Vulnerability classes the program has published as ineligible. Transcribe
  # them from the policy's "out of scope" section — every program has one.
  #
  # Findings matching these are MARKED, never deleted: they are kept out of the
  # report's reportable set and listed in a "Withheld" section quoting the
  # program's own reason. A scan that hands a triager the exact categories their
  # policy asks researchers not to send is worse than a scan that found nothing.
  #
  # Plain strings match case-insensitively anywhere in a finding's title,
  # description, tags or source tool. Prefix with `re:` for a regex.
  finding_classes:
    - match: "re:\\bHSTS\\b"
      reason: "Missing best practices in SSL/TLS configuration — out of scope."
    - match: "clickjacking"
      reason: "Clickjacking on pages with no sensitive actions — out of scope."

  # Denylist always wins over the allowlist, at every level.
  domains:
    - blog.example.com
    - status.example.com
  wildcards:
    - "*.corp.example.com"
    - "*.internal.example.com"
  cidrs:
    - 203.0.113.240/28
  ip_ranges: []
  regex:
    - '.*\.staging\.example\.com$'

rules:
  # Does "*.example.com" also authorize example.com itself? Most programs mean
  # yes, but Cordon fails closed: list the apex under domains: if you want it.
  wildcard_includes_apex: false
  # Refuse loopback/link-local/private/reserved IPs unless a cidr above covers
  # them explicitly. Stops SSRF-style pivots into infrastructure you don't own.
  deny_reserved_ips: true
  max_rps: 5
  max_concurrency: 5
  # Aggressive tools additionally require per-call human approval.
  allow_aggressive: true
  allow_exploitation: true
  # Whether the program's policy permits creating test accounts. Creating an
  # account is a state change on the target, so this defaults to false and only
  # the program's own words — transcribed here — may turn it on. Silence is not
  # permission.
  allow_self_registration: false
  # Anything whose purpose is volumetric disruption stays off, always.
  no_dos: true
  user_agent: "Cordon-AI/2.0 (authorized-testing; handle=your-handle)"
  # Paths the program has asked researchers not to touch.
  forbidden_paths:
    - /admin/delete
    - /api/v1/payments/execute

# Budget ceilings are OFF by default and this whole block is optional — delete
# it and the engagement runs until the work is done.
#
# They are a cost control, not a safety control, and the difference matters when
# one fires. `rules.max_rps` above protects the target and must bind. A budget
# ceiling protects your wallet, and tripping mid-engagement truncates coverage:
# phases left unrun, which this tool reports as UNTESTED, not clean. A partial
# report you have to remember the reason for is worse than a slow complete one.
#
# Uncomment to opt in. `enforce: true` is required — the numbers alone do
# nothing, so a stale ceiling left in a copied scope file cannot surprise you.
#
# budget:
#   enforce: true
#   llm_usd: 5.00              # only read when OPENROUTER_API_KEY is set
#   wall_clock_minutes: 240
#   max_requests: 50000
#   max_tool_seconds: 14400
